name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  # ==========================================
  # 1. LINTING
  # ==========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true

      - name: Install dependencies
        run: mise run deps:install

      - name: Run Linters (Go, TS, Prettier, Dotenv)
        run: mise run lint

  # ==========================================
  # 2. UNIT TESTS
  # ==========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-26.04
    needs: lint
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true

      - name: Install dependencies
        run: mise run deps:install

      - name: Run all tests
        run: mise run test

      - name: Upload Go Coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: backend/coverage.out
          retention-days: 3

      - name: Upload TS Coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ts-coverage
          path: frontend/coverage/
          retention-days: 3

  # ==========================================
  # 3. END TO END (PLAYWRIGHT)
  # ==========================================
  e2e-test:
    name: Playwright E2E
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true

      - name: Install dependencies
        run: mise run deps:install

      - name: Install Playwright OS Dependencies
        working-directory: frontend
        run: npx playwright install-deps

      - name: Run E2E Tests
        run: mise run e2e:run

      - name: Upload Playwright Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 3

  # ==========================================
  # 4. DOCKER BUILD CHECK
  # ==========================================
  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-26.04
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true

      - name: Build Docker image
        run: mise run docker:build

  # ==========================================
  # 5. SONARQUBE ANALYSIS
  # ==========================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-26.04
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Go Coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-coverage
          path: backend/

      - name: Download TS Coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ts-coverage
          path: frontend/coverage/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        with:
          args: >
            -Dsonar.qualitygate.wait=${{ github.ref != 'refs/heads/main' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
