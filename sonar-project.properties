sonar.projectKey=potibm_kasseapparat
sonar.organization=potibm

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=kasseapparat

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=backend,frontend
sonar.tests=backend,frontend

sonar.test.inclusions=**/*_test.go,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx
sonar.exclusions=**/node_modules/**,frontend/playwright-report/**,frontend/dist/**
# frontend/e2e and frontend/*.config.ts are excluded because no unit-test coverage is
# ever collected for them: the vitest run only instruments src/**. The e2e suite is
# verified by the Playwright job and the config files by the lint job, so counting them
# as uncovered new code would only ever report a permanent 0%.
sonar.coverage.exclusions=backend/cmd/**,backend/main.go,frontend/src/main.tsx,frontend/src/apps/pos/api/schemas.mocks.ts,frontend/e2e/**,frontend/*.config.ts

# Coverage Paths
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info